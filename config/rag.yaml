# Day 10 retrieval parameters. Runtime authority, the same posture as
# config/metrics.yaml: day 11 tunes these numbers while measuring, and tuning
# must not need a code edit or a migration.
version: 1

# Postgres text search configuration. Baked into 009_kb_fts.sql's generated
# column (a stored generated column needs an immutable expression), so this
# value exists to keep the query side in step with the index - changing it
# means a new migration, not just an edit here. `simple` (case folding, no
# stemming) is the day-10 choice for a mixed Turkish/English corpus: a
# Turkish stemmer mangles `higher_is_better`, an English one mangles the
# prose. Day 11 measures it.
text_search_config: simple

# Reciprocal rank fusion constant from the original paper. Large relative to
# the candidate depth, so the curve is gentle and rank 1 does not dominate.
rrf_k: 60

dense_candidates: 20
lexical_candidates: 20

# How many fused candidates reach the cross-encoder. Separate from the two
# retriever depths because fusion can surface up to their sum, and the
# reranker is the expensive stage - this is the number that bounds its cost.
rerank_candidates: 20

top_n: 5

# Abstention thresholds, measured by scripts/calibrate_abstain.py over
# evals/rag/abstain_calibration.yaml (16 covered + 13 deliberately uncovered
# questions, in both sentence and identifier shapes).
#
#   dense / hybrid   in-corpus 0.5099-0.6903, out-of-corpus 0.3587-0.5222
#                    -> OVERLAPPING. No midpoint exists.
#   hybrid_rerank    in-corpus 0.1386-0.9993, out-of-corpus 0.0000-0.0120
#                    -> gap 0.1266, midpoint 0.0753
#
# Cosine similarity cannot carry abstention. Two covered questions
# ("higher_is_better ne anlama geliyor?" 0.5099, "G - xG" 0.5153) score below
# three uncovered ones (0.5113, 0.5172, 0.5222), so no cut separates them.
# An earlier run reported a 0.0231 gap here; that was an artefact of a
# calibration set made entirely of full Turkish sentences, and adding
# identifier-shaped queries - a shape this tool will certainly be given -
# destroyed it. The number was corrected, not defended.
#
# So 0.5000 is not a midpoint: it is set just below the lowest covered score
# and tuned for one error type. It never falsely rejects a covered question
# (0 of 16) and still refuses 10 of 13 uncovered ones; the 3 it accepts are
# the overlap. Of the two failures, abstaining on a real question breaks the
# tool for the people using it, while accepting a weak passage is what the
# cross-encoder downstream exists to catch.
#
# Abstention is trustworthy only in hybrid_rerank, which refuses 13 of 13
# with 0 false rejections - and that is the measured reason it is the default
# mode rather than an optional extra. Day 11 re-measures both against the
# 50-question gold set.
#
# 0.0753 looks low for a "relevant" cut and is nevertheless correct: the
# binding constraint is the lowest covered question (0.1386), not what reads
# well.
dense_abstain_threshold: 0.5000
rerank_abstain_threshold: 0.0753

rerank_model: BAAI/bge-reranker-v2-m3
