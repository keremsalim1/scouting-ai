# Single Postgres instance with pgvector, used for everything: facts, views,
# data-quality rows and (from day 8) similarity vectors.
#
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml down        # keeps the volume
#   docker compose -f infra/docker-compose.yml down -v     # wipes the data
services:
  db:
    # pgvector ships the extension pre-built; installing it into the plain
    # postgres image would mean maintaining our own Dockerfile.
    image: pgvector/pgvector:pg17
    container_name: football_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-football}
      POSTGRES_USER: ${POSTGRES_USER:-football_etl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      # Deterministic collation so ORDER BY on player names is reproducible
      # across machines (Windows vs Linux default locales differ).
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      # Host port 55432, not 5432: avoids colliding with a locally installed
      # Postgres. The container still listens on 5432 internally.
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `make db-up` waits on this, so the ETL never races the server.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-football_etl} -d ${POSTGRES_DB:-football}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
    command:
      # 1.09M pass rows load via COPY; the defaults are tuned for tiny VMs.
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "work_mem=64MB"
      - "-c"
      - "maintenance_work_mem=512MB"

volumes:
  pgdata:
    name: football_pgdata
