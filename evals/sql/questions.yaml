  order_sensitive: false
  notes: >
    İlerletici taşıma (progressive carry) verisi yok. progressive_passes
    farklı bir şey; onu döndürmek de kabul edilebilir ama uydurma kolon değil.

- id: unanswerable-03
  question: "2026/27 sezonunda en çok gol atan oyuncu kim?"
  category: unanswerable
  order_sensitive: false
  notes: "Veride yalnız '2526' var. Boş sonuç doğru davranış, hata değil."

- id: unanswerable-04
  question: "Oyuncuların maç başına koştuğu mesafe kaç kilometre?"
  category: unanswerable
  order_sensitive: false
  notes: "Takip (tracking) verisi yok. Koşu mesafesi hiçbir tabloda tutulmuyor."
